# Reusable fan-out: run one coding task as N independent attempts and open one
# draft PR per attempt, then post a single comparison table back to the issue.
#
# Call it from your own repository:
#
#   jobs:
#     fanout:
#       uses: somaz94/agent-fanout/.github/workflows/fanout.yml@v1
#       with:
#         issue: ${{ github.event.issue.number }}
#         task: ${{ github.event.issue.body }}
#       secrets:
#         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# COST: this runs the agent once per variant. Three variants is three times the
# work of one run, whichever credential is used — `anthropic_api_key` bills per
# token, `claude_code_oauth_token` draws on a Claude subscription's limits.
# `max_variants` is a ceiling you cannot exceed by accident, and `dry_run` walks
# the whole pipeline without calling the agent at all.
name: Agent fan-out

on:
  workflow_call:
    inputs:
      issue:
        description: 'Issue number the task came from; the comparison is posted here'
        type: number
        required: true
      task:
        description: 'What the agent should do. Defaults to the issue body when empty.'
        type: string
        required: false
        default: ''
      variants:
        description: 'Comma-separated variant names. Each is a different instruction to the same agent, not a different agent.'
        type: string
        required: false
        default: 'conservative,refactor,minimal-diff'
      max_variants:
        description: 'Hard ceiling on how many attempts may run. Exceeding it fails the run before a single token is spent.'
        type: number
        required: false
        default: 3
      base_ref:
        description: 'Branch the attempts fork from'
        type: string
        required: false
        default: ''
      model:
        description: 'Model passed through to Claude Code'
        type: string
        required: false
        default: ''
      test_command:
        description: 'Command run inside each worktree after the agent finishes. Its exit status becomes the Tests column.'
        type: string
        required: false
        default: ''
      timeout_minutes:
        description: 'Per-attempt timeout'
        type: number
        required: false
        default: 30
      dry_run:
        description: 'Walk the pipeline without invoking the agent or opening PRs'
        type: boolean
        required: false
        default: false
    secrets:
      anthropic_api_key:
        description: 'ANTHROPIC_API_KEY — metered, billed per token. Not required when dry_run is true, nor when claude_code_oauth_token is supplied.'
        required: false
      claude_code_oauth_token:
        description: 'Claude Code OAuth token — draws on a Claude subscription instead of metered API credit. An alternative to anthropic_api_key, not an addition; supply exactly one.'
        required: false

permissions:
  contents: read

# Branch names are deterministic, so a re-label or a second dispatch would be
# rejected non-fast-forward and `gh pr create` would refuse a duplicate — every
# variant failing from the second run onward. cancel-in-progress stays FALSE:
# killing a run already mid-flight throws away metered agent time.
concurrency:
  group: agent-fanout-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  # The guard is a separate job so the ceiling is enforced BEFORE any runner
  # starts an agent. Validating inside the matrix would spend the tokens first
  # and complain afterwards.
  plan:
    name: Plan attempts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      variants: ${{ steps.plan.outputs.variants }}
      # Actions expressions have no arithmetic, so the job-level backstop is
      # derived here rather than as `timeout_minutes + 10` at the use site.
      job_timeout: ${{ steps.plan.outputs.job_timeout }}
    steps:
      - name: Resolve and bound the variant list
        id: plan
        env:
          VARIANTS: ${{ inputs.variants }}
          MAX: ${{ inputs.max_variants }}
          ATTEMPT_TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail

          # Split on commas, trim, drop blanks, and reject duplicates: two
          # attempts under one name collide on their branch and their artifact,
          # and the second silently overwrites the first.
          mapfile -t list < <(printf '%s' "$VARIANTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')

          if [ "${#list[@]}" -eq 0 ]; then
            echo "::error::no variants were given"; exit 1
          fi
          if [ "$(printf '%s\n' "${list[@]}" | sort | uniq -d | wc -l)" -gt 0 ]; then
            echo "::error::duplicate variant names: $(printf '%s\n' "${list[@]}" | sort | uniq -d | tr '\n' ' ')"
            exit 1
          fi
          # `[ x -gt y ]` exits 2 on a non-integer, and inside an `if` condition
          # `set -e` is suppressed and a non-zero status simply reads as FALSE.
          # So an empty or fractional max_variants made the ceiling vanish
          # silently — fail-OPEN, on the one guard the cost story rests on.
          # `type: number` accepts 3.5, and a caller passing an unresolved
          # expression can resolve it to empty, so both are reachable.
          # (An example is not written out here: a literal expression inside a
          # comment is still parsed by actionlint and fails the lint.)
          case "$MAX" in
            ''|*[!0-9]*) echo "::error::max_variants must be a positive integer, got '$MAX'"; exit 1 ;;
          esac
          if [ "$MAX" -lt 1 ]; then
            echo "::error::max_variants must be at least 1, got '$MAX'"; exit 1
          fi

          if [ "${#list[@]}" -gt "$MAX" ]; then
            echo "::error::${#list[@]} variants requested but max_variants is $MAX. Every attempt is a full metered agent run; raise the ceiling deliberately."
            exit 1
          fi
          for v in "${list[@]}"; do
            case "$v" in
              *[!a-zA-Z0-9._-]*) echo "::error::variant '$v' has characters that cannot go in a branch name"; exit 1 ;;
            esac
          done

          printf 'matrix=' >> "$GITHUB_OUTPUT"
          printf '%s\n' "${list[@]}" | jq -R . | jq -cs '{variant: .}' >> "$GITHUB_OUTPUT"
          echo "variants=$(IFS=,; echo "${list[*]}")" >> "$GITHUB_OUTPUT"
          case "$ATTEMPT_TIMEOUT" in
            ''|*[!0-9]*) echo "::error::timeout_minutes must be a positive integer, got '$ATTEMPT_TIMEOUT'"; exit 1 ;;
          esac
          if [ "$ATTEMPT_TIMEOUT" -lt 1 ]; then
            echo "::error::timeout_minutes must be at least 1, got '$ATTEMPT_TIMEOUT'"; exit 1
          fi
          echo "job_timeout=$(( ATTEMPT_TIMEOUT + 10 ))" >> "$GITHUB_OUTPUT"

          echo "Planned ${#list[@]} attempt(s): ${list[*]}"

  # Refused here, not inside the matrix: a missing or ambiguous credential is
  # discovered before any runner starts, and the failure names the input rather
  # than surfacing as N identical agent errors.
  credentials:
    name: Check credentials
    # No job-level `if`. A SKIPPED job propagates its skip to everything that
    # `needs` it, so gating this on dry_run would silently skip the whole
    # matrix on exactly the runs meant to exercise it. The dry-run case is
    # branched inside the step instead, where skipping costs nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exactly one credential must be supplied
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_KEY: ${{ secrets.anthropic_api_key != '' }}
          HAS_OAUTH: ${{ secrets.claude_code_oauth_token != '' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run - no credential needed"; exit 0
          fi
          if [ "$HAS_KEY" = "false" ] && [ "$HAS_OAUTH" = "false" ]; then
            echo "::error::supply either anthropic_api_key or claude_code_oauth_token (or set dry_run)"; exit 1
          fi
          if [ "$HAS_KEY" = "true" ] && [ "$HAS_OAUTH" = "true" ]; then
            echo "::error::supply only ONE of anthropic_api_key / claude_code_oauth_token"; exit 1
          fi
          echo "credential present"

  attempt:
    name: ${{ matrix.variant }}
    needs: [plan, credentials]
    runs-on: ubuntu-latest
    # Deliberately larger than the per-attempt timeout below. A JOB timeout
    # CANCELS the job, and a cancelled job skips its `if: always()` steps — so
    # the result file would never be written and the attempt would surface as
    # `missing`, a harness fault, when what happened is that the agent ran long.
    # Timing out the agent STEP instead leaves outcome=failure and lets the
    # reporting steps run. This ceiling is only a backstop.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job_timeout) }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      # One attempt failing must not cancel the others. The whole point is to
      # compare what the survivors produced, and a cancelled sibling reports as
      # missing — which reads as a harness fault rather than as a policy.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_ref }}

      - name: Prepare attempt
        id: prep
        env:
          VARIANT: ${{ matrix.variant }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          branch="agent-fanout/issue-${ISSUE}/${VARIANT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compose the variant instruction
        id: prompt
        env:
          VARIANT: ${{ matrix.variant }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            conservative)
              angle="Make the smallest change that solves the problem. Do not restructure existing code, do not rename anything, and match the surrounding style exactly." ;;
            refactor)
              angle="Solve the problem and leave the touched code better than you found it. Restructuring adjacent code is in scope when it removes duplication the fix would otherwise multiply." ;;
            minimal-diff)
              angle="Optimise for review effort. Produce the fewest changed lines that a reviewer can verify by reading the diff alone, even if a larger change would be tidier." ;;
            *)
              angle="Solve the problem in the way you judge best. State your approach in the PR body." ;;
          esac

          # The instruction travels as a step OUTPUT, never through a shell
          # string: an issue body is attacker-supplied text on a public repo,
          # and `run:` is a script-injection sink. A `with:` value is not — it
          # reaches the action as an INPUT_* environment variable.
          #
          # It is not written to a file either. `anthropics/claude-code-action`
          # exposes `prompt` and NO `prompt_file` at the top level, so a path
          # handed to `prompt` is taken as the literal prompt text: every
          # variant would burn a metered run and return no-changes.
          #
          # The heredoc delimiter is RANDOM. With a fixed `EOF` an issue body
          # containing a bare `EOF` line closes the block early and the rest is
          # parsed as further step outputs — arbitrary output injection.
          delim="FANOUT_$(openssl rand -hex 16)"
          {
            printf 'text<<%s\n' "$delim"
            printf '%s\n\n' "$angle"
            printf 'Task:\n%s\n' "$TASK"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: agent
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        timeout-minutes: ${{ inputs.timeout_minutes }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}

      - name: Measure the change
        id: measure
        env:
          BASE: ${{ steps.prep.outputs.base_sha }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "files=0"       >> "$GITHUB_OUTPUT"
            echo "add=0"         >> "$GITHUB_OUTPUT"
            echo "del=0"         >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "files=$(git diff --cached --name-only | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "add=$(git diff --cached --numstat | awk '{s+=$1} END {print s+0}')" >> "$GITHUB_OUTPUT"
          echo "del=$(git diff --cached --numstat | awk '{s+=$2} END {print s+0}')" >> "$GITHUB_OUTPUT"

      # Runs AFTER `Measure the change` has staged. `make test` writes
      # coverage files, node_modules and build output, and a `git add -A`
      # afterwards swept all of it into the PR and into the files/+/- counts
      # the comparison table exists to report. Staging first pins the index
      # to the agent's changes; anything the tests create stays outside it.
      - name: Run tests
        id: tests
        if: ${{ inputs.test_command != '' && !inputs.dry_run }}
        continue-on-error: true
        # Through env, not interpolated into the script body. This is a public
        # reusable workflow and its own documentation wires `task` to an issue
        # body; nothing here can stop a caller wiring `test_command` the same
        # way, and this job holds contents:write, pull-requests:write and the
        # API key.
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          set -euo pipefail
          bash -c "$TEST_COMMAND"

      - name: Commit and open a draft PR
        id: pr
        if: ${{ steps.measure.outputs.changed == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          # Two bugs in one line before this: a branch name may legally contain
          # $(...), backticks, `;` and `|`, so interpolating it into the script
          # body was an injection sink; and the PR base was github.ref_name
          # while the checkout used inputs.base_ref, so a caller setting
          # base_ref got a PR whose diff carried both branches apart.
          BASE_REF: ${{ inputs.base_ref != '' && inputs.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # No `git add` here on purpose: the index was pinned before the
          # tests ran, and re-adding would pull their output back in.
          git commit -q -m "feat: ${VARIANT} attempt for #${ISSUE}"
          git push -q -u origin "$BRANCH"

          # Draft on purpose. These are candidates, and one of them is going to
          # be closed; a ready-for-review PR pings every code owner on all N.
          url=$(gh pr create \
            --draft \
            --title "[${VARIANT}] attempt for #${ISSUE}" \
            --body "Automated fan-out attempt \`${VARIANT}\` for #${ISSUE}. One of several candidates — see the comparison on the issue." \
            --base "$BASE_REF" \
            --head "$BRANCH")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=$(basename "$url")" >> "$GITHUB_OUTPUT"

      - name: Write the result file
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          STARTED: ${{ steps.prep.outputs.started }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          PREP_OUTCOME: ${{ steps.prep.outcome }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CHANGED: ${{ steps.measure.outputs.changed }}
          FILES: ${{ steps.measure.outputs.files }}
          ADD: ${{ steps.measure.outputs.add }}
          DEL: ${{ steps.measure.outputs.del }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fanout-result

          # This runs under `always()` so that a variant which failed anywhere
          # above still reports. Without it a crashed attempt uploads nothing,
          # and "the agent errored" becomes indistinguishable from "the job was
          # never scheduled".
          # Every step that can fail has to be consulted. Reading only the
          # agent's outcome filed a broken `measure` as `no-changes` and a
          # failed `gh pr create` as `success` with an empty PR link — both of
          # which read as an agent verdict rather than as a harness fault.
          if [ "$DRY_RUN" = "true" ]; then
            status="no-changes"
          elif [ "$AGENT_OUTCOME" = "failure" ] \
            || [ "$PREP_OUTCOME" = "failure" ] \
            || [ "$MEASURE_OUTCOME" = "failure" ] \
            || [ "$PR_OUTCOME" = "failure" ]; then
            status="failed"
          elif [ "$CHANGED" = "true" ] && [ -n "${PR_URL:-}" ]; then
            status="success"
          elif [ "$CHANGED" = "true" ]; then
            status="failed"
          else
            status="no-changes"
          fi

          # set -u does not help: STARTED is set-but-EMPTY when `Prepare
          # attempt` died, and bash arithmetic reads an empty string as 0 — so
          # the duration became the whole epoch (~56 years) and shipped as a
          # plausible figure rather than as an error, from the very step that
          # exists to report that failure.
          if [ -z "${STARTED:-}" ]; then dur=0; else dur=$(( $(date +%s) - STARTED )); fi

          # --argjson parses its value as JSON, so a non-numeric PR number kills
          # this step outright — and this step dying is what turns a SUCCEEDED
          # attempt into a `missing` row.
          case "${PR_NUMBER:-}" in
            ''|*[!0-9]*) pr=0 ;;
            *)           pr="$PR_NUMBER" ;;
          esac

          case "$TESTS_OUTCOME" in
            success) tests="passed" ;;
            failure) tests="failed" ;;
            *)       tests="skipped" ;;
          esac

          jq -n \
            --arg  variant  "$VARIANT" \
            --arg  status   "$status" \
            --arg  branch   "$BRANCH" \
            --arg  pr_url   "${PR_URL:-}" \
            --arg  tests    "$tests" \
            --arg  sha      "$(git rev-parse HEAD)" \
            --argjson pr    "$pr" \
            --argjson files "${FILES:-0}" \
            --argjson add   "${ADD:-0}" \
            --argjson del   "${DEL:-0}" \
            --argjson dur   "$dur" \
            '{variant:$variant, status:$status, branch:$branch, pr_number:$pr,
              pr_url:$pr_url, files_changed:$files, additions:$add,
              deletions:$del, duration_seconds:$dur, commit_sha:$sha,
              test_status:$tests}' > "/tmp/fanout-result/${VARIANT}.json"

          cat "/tmp/fanout-result/${VARIANT}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanout-result-${{ matrix.variant }}
          path: /tmp/fanout-result/
          retention-days: 7

  compare:
    name: Compare
    needs: [plan, attempt]
    # always(): the comparison is most useful precisely when an attempt failed,
    # and `needs` on a failed job would skip this and leave the issue silent.
    # Gated on `plan` succeeding. download-artifact does not error when its
    # pattern matches nothing, and the action reports an absent directory as
    # missing rows — so a run the ceiling rejected posted an empty comparison
    # on top of the very error the caller needed to read.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download every attempt result
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: fanout-result-*

      - name: Post the comparison
        uses: somaz94/agent-fanout@v1
        with:
          results_dir: results
          # Passing the planned list is what makes an attempt that uploaded
          # NOTHING appear as a row. Without it the table quietly shrinks to the
          # attempts that survived.
          variants: ${{ needs.plan.outputs.variants }}
          issue: ${{ inputs.issue }}
          # QUOTED. YAML treats a `#` preceded by whitespace as the start of a
          # comment, so unquoted this read `Agent fan-out for` and the issue
          # number was silently cut off the heading — a thing no linter flagged
          # and only running it revealed.
          title: "Agent fan-out for #${{ inputs.issue }}"
          dry_run: ${{ inputs.dry_run }}
