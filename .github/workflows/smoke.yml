# Exercises the whole reusable workflow with dry_run: plan, the credential
# check, one attempt per variant and the comparison — without ever calling the
# agent, so a run costs nothing. Worth keeping: it is what caught a heading
# whose issue number a YAML comment had eaten, and it is the cheapest proof
# that the four jobs still wire together after an edit.
#
# It calls the workflow by PATH, which only works from inside this repository.
# A consumer must use the tag, because within a reusable workflow `uses: ./`
# resolves against the CALLER's checkout.
name: Smoke (dry run)

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Variants to plan'
        required: false
        default: 'conservative,refactor,minimal-diff'
        type: string

permissions: {}

jobs:
  smoke:
    uses: ./.github/workflows/fanout.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      issue: 1
      task: 'Smoke test - the agent is never invoked on a dry run.'
      variants: ${{ inputs.variants }}
      dry_run: true
