name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-prelude:
    name: Unit Tests + Docker Build
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Go test/lint + Docker build and push to local registry
        id: ci
        uses: somaz94/go-docker-action-ci-action@v1
        with:
          manage_registry: 'false'
          test_command: |
            set -euo pipefail
            go mod tidy
            # `git diff go.mod go.sum` fails two ways on a zero-dependency
            # module: naming go.sum when it does not exist is a git FATAL
            # (exit 128), not "no diff"; and `git diff` never sees an UNTRACKED
            # file, so the go.sum that appears the moment a first dependency is
            # added would slip through green. `git status --porcelain` answers
            # both, and the `--` keeps the missing path a pathspec rather than
            # a revision.
            if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
              echo 'FAIL: go.mod or go.sum is not tidy'
              git status --porcelain -- go.mod go.sum
              git diff -- go.mod go.sum || true
              exit 1
            fi
            go vet ./...
            if [ -n "$(gofmt -l .)" ]; then
              echo 'Code is not formatted. Run gofmt -s -w .'
              gofmt -d .
              exit 1
            fi
            go test ./... -v -cover -coverprofile=coverage.out

            # CLAUDE.md declares a >=90% floor and nothing enforced it, so
            # coverage could fall while CI stayed green. Measured over
            # ./internal/... — cmd/ is the entry point and is deliberately
            # thin, so folding it in would move the number for reasons that
            # are not about test quality.
            go test ./internal/... -coverprofile=internal.out >/dev/null
            pct=$(go tool cover -func=internal.out | awk '/^total:/ {print $3}' | tr -d '%')
            echo "internal coverage: ${pct}%"
            if awk -v p="$pct" 'BEGIN { exit !(p < 90) }'; then
              echo "FAIL: internal coverage ${pct}% is below the declared 90% floor"
              exit 1
            fi

      - name: Run the Container (dry-run)
        run: |
          docker run \
            --env INPUT_RESULTS_DIR="/fixtures" \
            --env INPUT_VARIANTS="conservative,refactor,minimal-diff" \
            --env INPUT_DRY_RUN="true" \
            --volume "$PWD/tests/fixtures/results:/fixtures:ro" \
            --rm "${{ steps.ci.outputs.image_ref }}"

  test-action:
    name: Action Integration Test
    needs: ci-prelude
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test Local Action (dry-run)
        id: test-action
        uses: ./
        with:
          results_dir: tests/fixtures/results
          variants: 'conservative,refactor,minimal-diff'
          dry_run: 'true'

      - name: Verify Output
        env:
          ATTEMPTS: ${{ steps.test-action.outputs.attempt_count }}
          SUCCESSES: ${{ steps.test-action.outputs.success_count }}
          MISSING: ${{ steps.test-action.outputs.missing_count }}
          COMPARISON: ${{ steps.test-action.outputs.comparison }}
        run: |
          set -euo pipefail

          # Two fixtures exist and three variants were declared. Asserting on
          # all three numbers is what pins the behaviour the whole action turns
          # on: the variant with no artifact must still be counted and rendered,
          # not quietly dropped from the comparison.
          [ "$ATTEMPTS"  = "3" ] || { echo "FAIL: attempt_count=$ATTEMPTS, want 3"; exit 1; }
          [ "$SUCCESSES" = "2" ] || { echo "FAIL: success_count=$SUCCESSES, want 2"; exit 1; }
          [ "$MISSING"   = "1" ] || { echo "FAIL: missing_count=$MISSING, want 1"; exit 1; }

          case "$COMPARISON" in
            *'minimal-diff'*) ;;
            *) echo "FAIL: the variant with no result file is absent from the table"; exit 1 ;;
          esac
          case "$COMPARISON" in
            *'not** ranked'*) ;;
            *) echo "FAIL: the unranked caveat is missing from the table"; exit 1 ;;
          esac

          echo "PASS: action outputs verified"

  ci-result:
    name: CI Result
    if: always()
    needs:
      - ci-prelude
      - test-action
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "[FAIL] Some jobs failed or were cancelled"
            exit 1
          fi
          echo "[PASS] All CI jobs passed"
